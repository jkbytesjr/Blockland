<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blockland</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #87ceeb; }
      canvas { display: block; }
      #overlay {
        position: fixed; z-index: 10; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 8px;
        background: rgba(0, 0, 0, 0.45); color: #fff; cursor: pointer;
        font: 16px/1.4 system-ui, sans-serif; text-align: center; user-select: none;
      }
      #overlay h1 { margin: 0 0 8px; font-size: 40px; letter-spacing: 2px; }
      #hud { position: fixed; inset: 0; pointer-events: none; user-select: none; font: 14px system-ui, sans-serif; }
      /* Crosshair: two thin bars that invert what's behind them */
      #crosshair { position: absolute; left: 50%; top: 50%; width: 20px; height: 20px; transform: translate(-50%, -50%); mix-blend-mode: difference; }
      #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #fff; }
      #crosshair::before { left: 9px; top: 0; width: 2px; height: 20px; }
      #crosshair::after { left: 0; top: 9px; width: 20px; height: 2px; }
      #hotbar {
        position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
        display: flex; gap: 4px; padding: 4px; background: rgba(0, 0, 0, 0.45); border-radius: 6px;
      }
      #hotbar .slot {
        position: relative; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
        border: 2px solid rgba(255, 255, 255, 0.15); border-radius: 4px; box-sizing: border-box;
      }
      #hotbar .slot.active { border-color: #fff; background: rgba(255, 255, 255, 0.18); }
      #hotbar .slot span { position: absolute; left: 3px; top: 1px; color: #fff; font-size: 11px; text-shadow: 0 1px 2px #000; }
      #block-name {
        position: absolute; left: 50%; bottom: 82px; transform: translateX(-50%);
        color: #fff; text-shadow: 0 1px 3px #000; opacity: 0;
      }
      #block-name.fade { animation: name-fade 1.6s ease-out; }
      @keyframes name-fade { 0%, 60% { opacity: 1; } 100% { opacity: 0; } }
    </style>
  </head>
  <body>
    <div id="overlay">
      <h1>BLOCKLAND</h1>
      <div>Click to play</div>
      <div>WASD move · Mouse look · Space jump · Esc release mouse</div>
      <div>Left click break · Right click place · 1-9 / scroll pick block</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
