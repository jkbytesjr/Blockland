<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blockland</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #87ceeb; }
      canvas { display: block; }
      #overlay {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 8px;
        background: rgba(0, 0, 0, 0.45); color: #fff; cursor: pointer;
        font: 16px/1.4 system-ui, sans-serif; text-align: center; user-select: none;
      }
      #overlay h1 { margin: 0 0 8px; font-size: 40px; letter-spacing: 2px; }
    </style>
  </head>
  <body>
    <div id="overlay">
      <h1>BLOCKLAND</h1>
      <div>Click to play</div>
      <div>WASD move · Mouse look · Space jump · Esc release mouse</div>
      <div>Left click break · Right click place</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
